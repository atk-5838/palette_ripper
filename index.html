<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palette Ripper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="logo-badge">🎨</div>
            <h1>Palette Ripper</h1>
            <p>Upload any image to extract its full spectrum of dominant colors & color names.</p>
        </header>

        <div class="upload-area" id="dropZone">
            <input type="file" id="imageInput" accept="image/*">
            <div class="upload-content">
                <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <p class="upload-title">Drop your image here, or <span>browse</span></p>
                <p class="upload-subtitle">Supports PNG, JPG, WEBP, and GIF</p>
            </div>
        </div>

        <div class="preview-container" id="previewContainer" style="display: none;">
            <img id="imagePreview" src="" alt="Uploaded Preview">
        </div>

        <canvas id="canvas"></canvas>

        <div class="palette-header" id="paletteHeader" style="display: none;">
            <h2>Extracted Color Palette</h2>
            <span id="colorCount" class="badge">0 Colors</span>
        </div>

        <div id="palette"></div>
    </div>

    <div id="toast" class="toast">Copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
